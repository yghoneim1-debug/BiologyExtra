      --primary-soft-border: #9fd3b8;
      --primary-text: #1b5e43;
      --table-header: #134732;

    [data-theme="ocean"] {
      --bg-page: #f5f8fc;
      --bg-card: #ffffff;
      --bg-subtle: #eaf0f8;
      --bg-muted: #dae4f2;
      --border-color: #bfd0e6;

      --text-secondary: #2d4769;
      --text-muted: #5a7699;
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-fg: #ffffff;
      --primary-soft: #e8effc;
      --primary-soft-border: #a5bdfa;
      --primary-text: #1e40af;

    /* Single Monochrome Dark Theme: White / Black */
    [data-theme="white-black"] {
      --bg-page: #09090b;
      --bg-card: #121215;
      --bg-subtle: #18181b;
      --bg-muted: #27272a;

      --primary-fg: #09090b;
      --primary-soft: #1f1f23;
      --primary-soft-border: #52525b;
      --primary-text: #ffffff;
      --table-header: #18181b;
      --svg-ink: #fafafa;
      --svg-accent: #ffffff;
      --svg-fill: #18181b;
      --glow-color: rgba(255, 255, 255, 0.2);

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      color: var(--text-main);

      transition: background-color 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Theme Utility Classes */
    .t-bg-page { background-color: var(--bg-page); }
    .t-bg-card { background-color: var(--bg-card); transition: background-color 0.3s ease, border-color 0.3s ease; }
    .t-bg-subtle { background-color: var(--bg-subtle); transition: background-color 0.3s ease, border-color 0.3s ease; }
    .t-bg-muted { background-color: var(--bg-muted); }
    .t-border { border-color: var(--border-color); }
    .t-border-strong { border-color: var(--border-strong); }
    .t-text-main { color: var(--text-main); }
    .t-text-secondary { color: var(--text-secondary); }
    .t-text-muted { color: var(--text-muted); }
    .t-primary-bg { background-color: var(--primary); color: var(--primary-fg); }
    .t-primary-bg:hover { background-color: var(--primary-hover); }
    .t-primary-soft { background-color: var(--primary-soft); border-color: var(--primary-soft-border); color: var(--primary-text); }
    .t-primary-text { color: var(--primary-text); }
    .t-table-header { background-color: var(--table-header); color: #ffffff; }

    /* Smooth Choreographed Keyframe Animations */
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(16px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes cardStaggerIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes springLand {
      0% { transform: scale(0.88); opacity: 0.6; }
      55% { transform: scale(1.035); opacity: 1; }
      80% { transform: scale(0.99); }
      100% { transform: scale(1); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 3px var(--glow-color); }
      50% { box-shadow: 0 0 0 6px var(--glow-color); }
    }

    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(130px) rotate(360deg) scale(0.4); opacity: 0; }
    }

    .animate-view-enter {
      animation: fadeSlideUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-card-stagger {
      opacity: 0;
      animation: cardStaggerIn 0.44s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-float {
      animation: subtleFloat 3.6s ease-in-out infinite;
    }

    .animate-pop {
      animation: springLand 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-shake {
      animation: shakeWrong 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .dashboard-card {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.26s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 14px 30px -10px var(--glow-color);
    }

    .draggable-card {
      cursor: grab;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.2s ease,
                  background-color 0.25s ease,
                  opacity 0.2s ease;
      touch-action: manipulation;
    }

    .draggable-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.14);
    }

    .draggable-card:active {
      cursor: grabbing;
      transform: scale(0.98);
    }

    .draggable-card.dragging {
      opacity: 0.4;
      transform: scale(0.95) rotate(-1.5deg);
    }

    .drop-slot {
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drop-slot.drag-over {
      background-color: var(--primary-soft) !important;
      border-color: var(--primary) !important;
      transform: scale(1.015);
      animation: pulseGlow 1.1s infinite ease-in-out;
    }

    .confetti-piece {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 3px;
      animation: confettiFall 0.95s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;

</head>

  <script>
    // =========================================================================
    // 0. WEB AUDIO API SOUND ENGINE (PROCEDURAL UI SOUNDS)
    // =========================================================================
    let soundEnabled = localStorage.getItem('bio_practice_sound') !== 'false';
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;

      if (type === 'pickup') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.065);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.075);
      } else if (type === 'drop') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.055);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      } else if (type === 'correct') {
        [523.25, 659.25].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const start = now + idx * 0.065;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.11, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.25);
        });
      } else if (type === 'wrong') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(195, now);
        osc.frequency.exponentialRampToValueAtTime(125, now + 0.16);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'complete') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const start = now + idx * 0.07;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.11, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.34);
        });
      } else if (type === 'click') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.045);
      }
    }

    let currentQuestionIndex = 0;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getAllSlots(q) {
      return q.type === 'table' ? q.rows.flatMap(r => r.slots) : q.slots;
    }

    function initQuestionState(q) {
      const allSlots = getAllSlots(q);
      const cards = {};
      const cardIds = [];

      allSlots.forEach((slot, idx) => {
        const cardId = `${q.id}_card_${idx}`;
        cards[cardId] = { id: cardId, text: slot.answer, correctSlotId: slot.id };
        cardIds.push(cardId);
      });

      appState[q.id] = {
        bankOrder: shuffleArray(cardIds),
        placements: {},
        checked: false,
        cards
      };
    }

    QUESTIONS.forEach(initQuestionState);

    function isSlotCorrect(q, slot) {
      const placedCardId = appState[q.id].placements[slot.id];
      if (!placedCardId) return null;
      const card = appState[q.id].cards[placedCardId];
      return card && card.text === slot.answer;
    }

    function getQuestionScore(q) {
      let correctCount = 0;
      getAllSlots(q).forEach(slot => {
        if (isSlotCorrect(q, slot) === true) correctCount++;
      });
      return correctCount * q.markPerSlot;
    }

    function getTotalScore() {
      return QUESTIONS.reduce((sum, q) => sum + getQuestionScore(q), 0);
    }

    }

    function resetCurrentQuestion() {
      playSound('pickup');
      const q = QUESTIONS[currentQuestionIndex];
      initQuestionState(q);
      selectedCardId = null;
      document.getElementById('feedback-banner').classList.add('hidden');
      triggerWorkspaceEnterAnimation();
      renderCurrentQuestion();
    }

    function resetAllQuestions(showFeedback = false) {
      playSound('pickup');
      QUESTIONS.forEach(initQuestionState);
      selectedCardId = null;
      renderDashboardCards(false);

      if (!document.getElementById('practice-screen').classList.contains('hidden')) {
        document.getElementById('feedback-banner').classList.add('hidden');
        triggerWorkspaceEnterAnimation();
        renderCurrentQuestion();
      } else if (showFeedback) {
        const btn = document.getElementById('dashboard-reset-btn');
        if (btn) {
          const orig = btn.innerHTML;
          btn.innerHTML = '<span>✓</span><span>Progress Reset!</span>';
          setTimeout(() => { btn.innerHTML = orig; }, 1100);
        }
      }
    }

    // =========================================================================
    // 6. DRAG-AND-DROP & TAP-TO-PLACE WITH SOUND EFFECTS
    // =========================================================================
    function handleDragStart(event, cardId) {
      draggedCardId = cardId;
      selectedCardId = null;
      playSound('pickup');
      event.dataTransfer.setData('text/plain', cardId);
      event.dataTransfer.effectAllowed = 'move';
      setTimeout(() => {
        const el = document.getElementById(`card_${cardId}`);
        if (el) el.classList.add('dragging');
      }, 0);
    }

    function handleDragEnd(event, cardId) {
      draggedCardId = null;
      const el = document.getElementById(`card_${cardId}`);
      if (el) el.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDropToSlot(event, targetSlotId) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      const cardId = event.dataTransfer.getData('text/plain') || draggedCardId;
      if (!cardId) return;
      placeCardInSlot(cardId, targetSlotId);
    }

    function handleDropToBank(event) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      const cardId = event.dataTransfer.getData('text/plain') || draggedCardId;
      if (!cardId) return;
      returnCardToBank(cardId);
    }

    function selectCard(cardId, event) {
      if (event) event.stopPropagation();
      playSound('pickup');
      selectedCardId = selectedCardId === cardId ? null : cardId;
      renderCurrentQuestion();
    }

    function handleSlotClick(targetSlotId) {
      const q = QUESTIONS[currentQuestionIndex];
      const state = appState[q.id];

      if (selectedCardId) {
        placeCardInSlot(selectedCardId, targetSlotId);
        selectedCardId = null;
      } else if (state.placements[targetSlotId]) {
        selectCard(state.placements[targetSlotId]);
      }
    }

    function placeCardInSlot(cardId, targetSlotId) {
      const q = QUESTIONS[currentQuestionIndex];
      const state = appState[q.id];
      const prevScore = getQuestionScore(q);

      let sourceSlotId = null;
      for (const [sId, cId] of Object.entries(state.placements)) {
        if (cId === cardId) {
          sourceSlotId = sId;
          break;
        }
      }

      const existingTargetCardId = state.placements[targetSlotId];
      state.bankOrder = state.bankOrder.filter(id => id !== cardId);

      if (sourceSlotId) {
        if (existingTargetCardId) {
          state.placements[sourceSlotId] = existingTargetCardId;
        } else {
          delete state.placements[sourceSlotId];
        }
      } else if (existingTargetCardId) {
        state.bankOrder.push(existingTargetCardId);
      }

      state.placements[targetSlotId] = cardId;

      if (feedbackMode === 'exam') {
        state.checked = false;
        playSound('drop');
      } else {
        const targetSlot = getAllSlots(q).find(s => s.id === targetSlotId);
        const correct = targetSlot && isSlotCorrect(q, targetSlot);
        const newScore = getQuestionScore(q);
        if (correct && newScore === q.marks && prevScore < q.marks) {
          playSound('complete');
          spawnConfetti();
        } else if (correct) {
          playSound('correct');
        } else {
          playSound('wrong');
        }
      }

      renderCurrentQuestion(targetSlotId);
    }

    function returnCardToBank(cardId, event) {
      if (event) event.stopPropagation();
      playSound('drop');
      const q = QUESTIONS[currentQuestionIndex];
      const state = appState[q.id];

      for (const [sId, cId] of Object.entries(state.placements)) {
        if (cId === cardId) delete state.placements[sId];
      }

      if (!state.bankOrder.includes(cardId)) {
        state.bankOrder.push(cardId);
      }

      if (selectedCardId === cardId) selectedCardId = null;
      if (feedbackMode === 'exam') state.checked = false;

      renderCurrentQuestion();
    }

    // 7. CLEAN RENDERERS (TABS, TABLES, SVG DIAGRAMS, BANK)
    // =========================================================================
    function renderTabs() {
      const nav = document.getElementById('question-tabs');
      nav.innerHTML = QUESTIONS.map((q, idx) => {
        const isActive = idx === currentQuestionIndex;
        const score = getQuestionScore(q);
        const isComplete = score === q.marks;

        return `
          <button onclick="switchQuestion(${idx})"
            class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 border ${
              isActive
                ? 't-primary-bg border-transparent shadow-2xs'
                : 't-bg-subtle t-text-secondary t-border hover:opacity-85'
            }">
            <span>${q.tabLabel}</span>
            ${isComplete ? '<span class="text-[10px]">✓</span>' : ''}
          </button>
        `;
      }).join('');
    }

    function renderSlotContent(q, slot, recentlyPlacedSlotId, compact = false) {
      const state = appState[q.id];
      const placedCardId = state.placements[slot.id];
      const showValidation = feedbackMode === 'instant' || state.checked;

      if (!placedCardId) {
        const highlightSelect = selectedCardId
          ? 't-primary-soft border-current ring-2 ring-current/20 cursor-pointer'
          : 't-border-strong t-bg-subtle hover:opacity-85';

        return `
          <div ondragover="handleDragOver(event)"
               ondragleave="handleDragLeave(event)"
               ondrop="handleDropToSlot(event, '${slot.id}')"
               onclick="handleSlotClick('${slot.id}')"
               class="drop-slot w-full ${compact ? 'min-h-[42px] px-3 py-1.5' : 'min-h-[64px] p-3'} rounded-xl border border-dashed ${highlightSelect} flex items-center justify-center text-center">
            <span class="text-xs font-medium ${selectedCardId ? 't-primary-text font-bold' : 't-text-muted'}">
              ${selectedCardId ? 'Place here' : (compact ? slot.label : 'Drop here')}
            </span>
          </div>
        `;
      }

      const card = state.cards[placedCardId];
      const correct = isSlotCorrect(q, slot);
      const isSelected = selectedCardId === placedCardId;
      const animClass = recentlyPlacedSlotId === slot.id
        ? (showValidation ? (correct ? 'animate-pop' : 'animate-shake') : 'animate-pop')
        : '';

      let statusClasses = 't-bg-card t-border-strong t-text-main shadow-2xs';
      let statusIcon = '';

      if (showValidation) {
        if (correct) {
          statusClasses = 'bg-emerald-500/15 border-emerald-500 t-text-main';
          statusIcon = `<span class="w-4 h-4 rounded-full bg-emerald-600 text-white text-[10px] font-bold flex items-center justify-center shrink-0">✓</span>`;
        } else {
          statusClasses = 'bg-rose-500/15 border-rose-500 t-text-main';
          statusIcon = `<span class="w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] font-bold flex items-center justify-center shrink-0">✕</span>`;
        }
      }

      if (isSelected) {
        statusClasses += ' ring-2 ring-amber-400';
      }

      return `
        <div id="card_${placedCardId}"
             draggable="true"
             ondragstart="handleDragStart(event, '${placedCardId}')"
             ondragend="handleDragEnd(event, '${placedCardId}')"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDropToSlot(event, '${slot.id}')"
             onclick="handleSlotClick('${slot.id}')"
             class="drop-slot draggable-card ${animClass} w-full ${compact ? 'px-2.5 py-1.5' : 'p-3'} rounded-xl border-2 ${statusClasses} flex items-center justify-between gap-2 text-left">
          <div class="flex items-center gap-2 min-w-0">
            ${statusIcon}
            <span class="${compact ? 'text-xs font-semibold' : 'text-xs sm:text-sm font-medium'} leading-snug">${card.text}</span>
          </div>
          <button onclick="returnCardToBank('${placedCardId}', event)"
                  title="Remove"
                  class="w-5 h-5 rounded-full t-bg-muted hover:opacity-80 t-text-main flex items-center justify-center text-xs font-bold shrink-0 transition">
            ×
          </button>
        </div>
      `;
    }

    function renderAnswerBank() {
      const q = QUESTIONS[currentQuestionIndex];
      const state = appState[q.id];
      const bankEl = document.getElementById('answer-bank');
      const countEl = document.getElementById('bank-count');
      const hintEl = document.getElementById('selected-hint');

      countEl.textContent = state.bankOrder.length;
      hintEl.classList.toggle('hidden', !selectedCardId);

      if (state.bankOrder.length === 0) {
        bankEl.innerHTML = `
          <div class="py-10 text-center t-text-muted text-xs font-semibold">
            ✓ All placed
          </div>
        `;
        return;
      }

      bankEl.innerHTML = state.bankOrder.map(cardId => {
        const card = state.cards[cardId];
        const isSelected = selectedCardId === cardId;

        return `
          <div id="card_${cardId}"
               draggable="true"
               ondragstart="handleDragStart(event, '${cardId}')"
               ondragend="handleDragEnd(event, '${cardId}')"
               onclick="selectCard('${cardId}', event)"
               class="draggable-card p-3 rounded-xl border text-left text-xs sm:text-sm font-medium leading-snug ${
                 isSelected
                   ? 't-primary-bg border-transparent shadow-md ring-2 ring-amber-400'
                   : 't-bg-card t-text-main t-border hover:border-current'
               }">
            ${card.text}
          </div>
        `;
      }).join('');
    }

    function renderCurrentQuestion(recentlyPlacedSlotId = null) {
      const q = QUESTIONS[currentQuestionIndex];

      document.getElementById('q-badge').textContent = q.id;
      document.getElementById('q-marks-badge').textContent = `${q.marks} marks`;
      document.getElementById('q-title').textContent = q.title;

      const nextBtn = document.getElementById('next-q-btn');
      if (nextBtn) {
        nextBtn.textContent = currentQuestionIndex < QUESTIONS.length - 1 ? 'Next Question →' : 'Finish →';
      }

      const checkBtn = document.getElementById('check-btn');
      checkBtn.classList.toggle('hidden', feedbackMode === 'instant');

      if (q.type === 'table') {
        renderTableQuestion(q, recentlyPlacedSlotId);
      } else {
        renderDiagramQuestion(q, recentlyPlacedSlotId);
      }

      renderAnswerBank();
      updateScoresUI();
    }

    // Initialize on load
    applyTheme(currentTheme);
    updateSoundButtonsUI();
    renderDashboardCards(false);
    renderCurrentQuestion();
  </script>
